<main id="contact">
    <section>
        <div class="container-texts">
            <p class="texto-title">Contato</p>
            <h1 class="contact-title">Vamos conversar?</h1>
            <p class="paragraph-title">Entre em contato pelo WhatsApp para solicitar um orçamento sem compromisso. Respondo rapidinho!</p>
        </div>

        <div class="contacts-container">
            <div class="content-contacts">
                <div class="infos">
                    <i class="bi bi-telephone icon-info"></i>
                    <div class="content-infos">
                        <p>Whatsapp</p>
                        <h3>(21) 97055-7657</h3>
                    </div>
                </div>
                <div class="infos">
                    <i class="bi bi-clock icon-info"></i>
                    <div class="content-infos">
                        <p>Horário de atendimento</p>
                        <h3>Seg a Sáb, 9h às 17h</h3>
                    </div>
                </div>
            </div>

            <a (click)="openWhatsApp()" class="button"><i class="bi bi-whatsapp"></i>Chamar no Whatsapp</a>

            <p class="contact-paragraph">Orçamento gratuito e sem compromisso</p>
        </div>
    </section>
</main>
